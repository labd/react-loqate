name: Release
on: [push]

env:
  CI: true

jobs:
  lint-test-build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: true

      - name: Check formatting and typing
        run: pnpm check

      - name: Test
        run: pnpm run test:ci

      - name: Build
        run: pnpm build

  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    environment: release
    needs: lint-test-build
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Install node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: true

      - name: Upgrade npm for trusted publishing
        run: npm i -g npm@^11.11.0

      - name: Create and publish versions
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # changesets/action v2 renamed every one of these inputs.
          pr-title: 'Release new version'
          commit-message: 'update version'
          publish-script: pnpm publish:ci
          # v2 pushes the release commit and tags through the GitHub API; the
          # git CLI path keeps the previous behaviour.
          push-with-git-cli: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
